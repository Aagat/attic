name: Linux binaries

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.LINUX_RUNNER_LABEL || 'ubuntu-latest' }}
    container:
      image: node:22.22.0-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - uses: https://github.com/pnpm/action-setup@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      - name: Build and test
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: bash scripts/build-release.sh "$RELEASE_VERSION"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: https://code.forgejo.org/actions/forgejo-release@98265452477dafb3f0f27ba9c462c90b18cb44fd # v2.13.4
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          token: ${{ github.token }}
          release-dir: dist/release
          override: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          release-notes: Linux x86-64 binary with embedded UI and database migrations. See the included README for runtime requirements.
