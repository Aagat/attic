services:
  attic:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ATTIC_IMAGE:-attic:local}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    # Chromium's namespace/setuid sandbox needs these two capabilities during
    # sandbox setup. The browser itself remains non-root and the root
    # filesystem remains read-only; do not add --no-sandbox.
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
    env_file:
      - .env
    environment:
      ARTIFACT_ROOT: /data/artifacts
      TMPDIR: /tmp
      LISTEN_ADDRESS: 0.0.0.0:8080
      BROWSER_EXECUTABLE: /usr/bin/chromium-browser
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      # Lets DATABASE_URL reach PostgreSQL installed directly on this host.
      - "host.docker.internal:host-gateway"
    volumes:
      - attic-data:/data
    # Migration SQL is baked into the image at read-only /app/migrations;
    # the migration runner consumes that directory.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /dev/shm:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/health/ready || exit 1
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # There is deliberately no PostgreSQL service here. DATABASE_URL must
    # point to the operator's existing PostgreSQL 14+ instance.

volumes:
  attic-data:
    name: attic-data
