# Attic - Kindle Content Converter Configuration

# Server settings
# Port on which the server will listen
# Default: 8080
# Environment variable: ATTIC_SERVER_PORT
server_port: "8080"

# Kindle email settings
# Your Kindle's email address (required)
# This is the email address ending in @kindle.com
# Environment variable: ATTIC_KINDLE_EMAIL
kindle_email: "your-kindle@kindle.com"

# Email sender settings
# The email address that will send content to your Kindle (required)
# Must be authorized in your Amazon Kindle settings
# Environment variable: ATTIC_SENDER_EMAIL
sender_email: "your-email@example.com"

# App-specific password for the sender email (required)
# For Gmail, create one at: https://myaccount.google.com/apppasswords
# Environment variable: ATTIC_SENDER_PASSWORD
sender_password: "your-app-specific-password"

# AI/LLM settings
# Google Gemini API key (required)
# Get one from: https://aistudio.google.com/apikey
# Environment variable: ATTIC_LLM_API_KEY
llm_api_key: "your-llm-api-key"

# Gemini model to use
# Default: gemini-2.0-flash-exp
# Environment variable: ATTIC_MODEL
model: "gemini-2.0-flash-exp"

# PDF output profiles
# Configure different PDF output formats for various e-readers
default_profile: "kindle_scribe"  # Default profile to use

pdf_profiles:
  # Kindle Scribe profile - optimized for 10.2" display
  - name: kindle_scribe
    margin_size: "0.5in"
    font_size: "14pt"
    paper_size: "letter"
    show_numbers: false

  # Standard Kindle profile - optimized for 6" display
  - name: kindle
    margin_size: "0.4in"
    font_size: "12pt"
    paper_size: "letter"
    show_numbers: false

  # Kobo profile - optimized for various Kobo devices
  - name: kobo
    margin_size: "0.45in"
    font_size: "12pt"
    paper_size: "a4"
    show_numbers: false