# Local validation override; run together with compose.yaml.
# .env must use validation-db:5432 in DATABASE_URL and provide the matching
# VALIDATION_DB_PASSWORD. This database is separate from other local projects.
services:
  attic:
    environment:
      SMTP_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS_MODE: none
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_SENDER: attic@example.test
      SMTP_DESTINATION: reader@example.test
    ports: !override
      - "0.0.0.0:18080:8080"
    depends_on:
      mailpit:
        condition: service_started
      validation-db:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    restart: unless-stopped
    ports:
      - "0.0.0.0:18025:8025"
    environment:
      MP_MAX_MESSAGES: "100"
  validation-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: attic
      POSTGRES_DB: attic
      POSTGRES_PASSWORD: ${VALIDATION_DB_PASSWORD:?Set VALIDATION_DB_PASSWORD in .env}
    volumes:
      - validation-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attic -d attic"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  validation-postgres:
    name: attic-validation-postgres
